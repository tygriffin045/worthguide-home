<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"The Worth Guide","url":"https://theworthguide.com/"}</script>
<style>
  :root{--bg:#f7f4ef;--card:#fffdf9;--line:#e7e1d6;--ink:#1c1917;--muted:#57534e;--accent:#c45c26;--accent-dark:#a84c1f;--tint:#efe8dc}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:baseline;gap:10px;padding-top:16px;padding-bottom:16px}
  .brand{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.35rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  main{flex:1}
  .hero{padding:64px 0 36px;text-align:center}
  .eyebrow{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--tint);padding:4px 12px;border-radius:999px;margin-bottom:18px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
  .tagline{font-size:clamp(1.05rem,2.4vw,1.25rem);color:var(--muted);max-width:620px;margin:0 auto}
  .grid{list-style:none;margin:0;padding:24px 0 72px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .card{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 28px rgba(68,48,28,.10);border-color:#d8cbb8;outline:none}
  .icon{width:48px;height:48px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:1.5rem;margin-bottom:16px}
  .card h2{font-family:"Source Serif 4",Georgia,serif;font-size:1.35rem;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
  .card p{margin:0 0 18px;color:var(--muted);font-size:.98rem;flex:1}
  .go{font-weight:600;color:var(--accent);font-size:.95rem}
  .card:hover .go{color:var(--accent-dark)}
  footer{border-top:1px solid var(--line);background:var(--tint)}
  footer .wrap{padding-top:22px;padding-bottom:26px;font-size:.9rem;color:var(--muted);text-align:center}
  footer p{margin:4px 0}
  @media (max-width:520px){.hero{padding:44px 0 24px}.grid{padding-bottom:48px}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">The Worth <span>Guide</span></a></div></header>
<main>
  <section class="hero wrap">
    <div class="eyebrow">Independent reviews</div>
    <h1>The Worth Guide</h1>
    <p class="tagline">Honest picks that are actually worth the money — real tradeoffs spelled out, no invented scores, no hype.</p>
  </section>
  <section class="wrap" aria-label="Our guides">
    <ul class="grid" id="sites"></ul>
    <noscript><ul class="grid">
        <li><a class="card" href="https://desk.theworthguide.com/"><h2>DeskWorth</h2><p>Home office gear: desks, chairs, monitors and more.</p></a></li>
        <li><a class="card" href="https://brew.theworthguide.com/"><h2>BrewWorth</h2><p>Home coffee gear: espresso, grinders and pour-over.</p></a></li>
        <li><a class="card" href="https://sleep.theworthguide.com/"><h2>SleepWorth</h2><p>Sleep gear: pillows, toppers, sheets and more.</p></a></li>
        <li><a class="card" href="https://pet.theworthguide.com/"><h2>PetWorth</h2><p>Dog and cat gear: beds, feeders, harnesses and more.</p></a></li>
    </ul></noscript>
  </section>
</main>
<footer><div class="wrap">
  <p>As an Amazon Associate we earn from qualifying purchases.</p>
  <p>&copy; <span id="yr">2026</span> The Worth Guide</p>
</div></footer>
<script>
  // ── Add a new category: append one object to this list. ──
  const SITES = [
    { name: "DeskWorth",  icon: "🖥️", url: "https://desk.theworthguide.com/",  desc: "Standing desks, ergonomic chairs, monitors and keyboards for a better home office." },
    { name: "BrewWorth",  icon: "☕",  url: "https://brew.theworthguide.com/",  desc: "Espresso machines, grinders and pour-over gear for better coffee at home." },
    { name: "SleepWorth", icon: "🌙", url: "https://sleep.theworthguide.com/", desc: "Pillows, toppers, sheets and bedroom tools for deeper, cooler sleep." },
    { name: "PetWorth",   icon: "🐾", url: "https://pet.theworthguide.com/",   desc: "Beds, feeders, harnesses and toys for happier dogs and cats." },
  ];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  document.getElementById("sites").innerHTML = SITES.map(s => `
    <li><a class="card" href="${esc(s.url)}">
      <div class="icon" aria-hidden="true">${esc(s.icon)}</div>
      <h2>${esc(s.name)}</h2>
      <p>${esc(s.desc)}</p>
      <span class="go">Visit ${esc(s.name)} &rarr;</span>
    </a></li>`).join("");
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
